version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-risk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database_scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: marketplace-risk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  anomaly-model:
    build:
      context: ../marketplace-risk-anomaly-model
      dockerfile: Dockerfile
    container_name: marketplace-risk-anomaly-model
    ports:
      - "5000:5000"
    environment:
      - MODEL_PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../marketplace-risk-backend
      dockerfile: Dockerfile
    container_name: marketplace-risk-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://postgres:5432/marketplace_risk
      - DB_USERNAME=riskuser
      - DB_PASSWORD=riskpass123
      - MODEL_SERVER_URL=http://anomaly-model:5000
      - AUTO_ENFORCE_THRESHOLD=85.0
      - ANALYST_REVIEW_THRESHOLD=50.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      anomaly-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../marketplace-risk-frontend
      dockerfile: Dockerfile
    container_name: marketplace-risk-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
